# GoReleaser configuration. See https://goreleaser.com
#
# `chant release cut` runs this in snapshot mode (goreleaser release --snapshot
# --clean --skip=publish) and records the archives and checksums it writes; chant
# publishes them and the container image (see chant.config.json and RELEASING.md).
version: 2

project_name: mudflaps

before:
  hooks:
    - go mod tidy

builds:
  - id: mudflaps
    main: ./cmd/mudflaps
    binary: mudflaps
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: mudflaps
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: intentius
    name: mudflaps

snapshot:
  version_template: "{{ .Env.CHANT_RELEASE_LABEL }}"
